name: Sideload APK
run-name: Build sideloadable debug APK

on:
  workflow_dispatch:
  push:
    branches: [dive-3575-apk]

concurrency:
  group: sideload-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Prime Flutter SDK
        run: flutter --version
      - name: Install dependencies
        run: cd mobile && flutter pub get
      - name: Build Android debug APK
        run: just mobile-build-android
      - name: Show APK output
        run: ls -la mobile/build/app/outputs/flutter-apk/
      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-debug-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
